name: Bug report
description: Report an issue with the API and include steps to reproduce it.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Include the request, expected result, actual response, and external-service setup.
        Redact API keys and use synthetic tokens only.

  - type: input
    id: version
    attributes:
      label: App Version / Build Number
      description: "Include the application JAR name and build identifier, if available."
      placeholder: "internal-0.0.1-SNAPSHOT.jar"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity / Impact
      options:
        - "Critical (App crashes, data loss, complete blocker)"
        - "Major (Core functionality broken, but workaround exists)"
        - "Minor (Incorrect error wording or another low-impact issue)"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: "Include your OS, Java version, application URL, and WireMock port."
      placeholder: |
        OS:
        Java version:
        Application URL: http://localhost:8080
        WireMock port: 8888
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: "A clear and concise description of what the bug is."
      placeholder: "LOGIN rejects a valid 32-character token containing Z."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: "Include session prerequisites, WireMock responses, and the request method, path, headers, and form fields. Do not include API-key values."
      placeholder: |
        1. Start the application with the configured API key and mock URL.
        2. Stub POST /auth to return HTTP 200.
        3. Send POST /endpoint with X-Api-Key: [redacted],
           Content-Type: application/x-www-form-urlencoded, and Accept: application/json.
        4. Set action=LOGIN and token to 32 uppercase Z characters.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: "State the expected behavior and the assignment requirement it follows from."
      placeholder: 'LOGIN accepts the documented A-Z0-9 token format and returns {"result":"OK"} when /auth succeeds.'
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Error Logs
      description: "Include the HTTP status, JSON response, observed external requests, and relevant Allure evidence. Redact credentials from logs."
      placeholder: 'HTTP 400 with result ERROR and a message requiring ^[0-9A-F]{32}$. No request reaches /auth.'
    validations:
      required: true

  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validation
      options:
        - label: "I reproduced this issue on the application build specified above."
          required: true
